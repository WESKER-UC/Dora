<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title> Something's up? 😋</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #888C91;
      font-family: 'Inter', 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
      touch-action: pan-x pan-y;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #petalCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .countdown {
      position: relative;
      z-index: 20;
      text-align: center;
      color: #ffffff;
      font-weight: 700;
      font-size: clamp(1.8rem, 8vw, 5rem);
      line-height: 1.4;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.12);
      user-select: none;
      pointer-events: none;
      padding: 1rem;
      max-width: 90vw;
      word-break: keep-all;
    }

    .countdown span {
      display: inline-block;
      white-space: nowrap;
    }

    .line1, .line2 {
      display: block;
    }

    .line1 {
      margin-bottom: 0.25em;
    }

    @media (prefers-reduced-motion: reduce) {
      #petalCanvas {
        opacity: 0.5;
      }
    }

    @media (max-width: 480px) {
      .countdown {
        font-size: clamp(1.5rem, 9vw, 2.8rem);
        line-height: 1.5;
      }
    }
  </style>
</head>
<body>
  <canvas id="petalCanvas"></canvas>
  <div class="countdown" id="countdown">
    <span class="line1" id="line1">0d</span>
    <span class="line2" id="line2">00h 00m 00s</span>
  </div>

  <script>
    (function(){
      'use strict';

      // ============================================================
      // CONFIG
      // ============================================================
      const PETAL_BASE_COUNT = 200;          // base number of falling petals
      const MAX_PETALS = 100000000;               // cap for final-day density
      const MIN_SIZE = 8;
      const MAX_SIZE = 28;
      const WIND_RADIUS = 140;
      const WIND_STRENGTH = 2;
      const BASE_FALL_SPEED = 0.5;
      const ROTATION_SPEED = 0.014;

      // Diagonal / sideways breeze (left → right)
      const SIDEWAYS_BIAS = 0.8;
      const SIDEWAYS_JITTER = 0.35;

      // Accumulation settings
      const ACCUMULATION_MAX_HEIGHT_RATIO = 1; // max 35% of screen height at bottom
      const MAX_ACCUMULATED = 900;
      const ACCUMULATED_PETALS_KEY = 'serene-countdown-accumulated-petals-v1';

      // ============================================================
      // CANVAS SETUP
      // ============================================================
      const canvas = document.getElementById('petalCanvas');
      const ctx = canvas.getContext('2d');
      let width = 0, height = 0;

      // ============================================================
      // STATE
      // ============================================================
      let fallingPetals = [];
      let accumulatedPetals = [];
      let targetTime = 0;                   // ms timestamp for target
      let clockOffsetMs = 0;                // correction from the online Cairo clock
      let countdownDone = false;

      // Cursor / wind
      let mouseX = -10000, mouseY = -10000;
      let lastMouseX = -10000, lastMouseY = -10000;
      let mouseVX = 0, mouseVY = 0;
      let mouseActive = false;

      // Reduced motion
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Petal density multiplier (grows on final day)
      let densityMultiplier = 1;

      // ============================================================
      // HELPERS
      // ============================================================
      function rand(min, max) { return Math.random() * (max - min) + min; }

      // Create a single falling petal
      function createPetal(yStart) {
        const size = rand(MIN_SIZE, MAX_SIZE);
        const type = Math.floor(Math.random() * 3);

        const hue = rand(330, 360);
        const sat = rand(40, 70);
        const light = rand(75, 95);
        const alpha = rand(0.35, 0.85);

        const driftBias = SIDEWAYS_BIAS + rand(-SIDEWAYS_JITTER, SIDEWAYS_JITTER);
        const driftX = driftBias;

        return {
          x: Math.random() * width,
          y: yStart !== undefined ? yStart : -size - Math.random() * height * 0.4,
          size,
          type,
          hue, sat, light, alpha,
          speedY: BASE_FALL_SPEED * rand(0.6, 1.5),
          driftX: driftX,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: rand(-ROTATION_SPEED, ROTATION_SPEED),
          windVX: 0,
          windVY: 0,
          rotBoost: 0,
          seed1: rand(0.5, 1),
          seed2: rand(0.5, 1),
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: rand(0.012, 0.03),
        };
      }

      // Create a settled petal for bottom accumulation
      function createSettledPetal() {
        const size = rand(MIN_SIZE * 0.9, MAX_SIZE * 1.1);
        const type = Math.floor(Math.random() * 3);
        const hue = rand(330, 360);
        const sat = rand(40, 70);
        const light = rand(75, 95);
        const alpha = rand(0.5, 0.9);

        return {
          x: Math.random() * width,
          y: Math.random() * height,
          size,
          type,
          hue, sat, light, alpha,
          rot: Math.random() * Math.PI * 2,
          seed1: rand(0.5, 1),
          seed2: rand(0.5, 1),
        };
      }

      function saveAccumulatedPetals() {
        try {
          localStorage.setItem(ACCUMULATED_PETALS_KEY, JSON.stringify({
            width,
            height,
            petals: accumulatedPetals,
          }));
        } catch (error) {
          // The animation continues if storage is unavailable.
        }
      }

      function loadAccumulatedPetals() {
        try {
          const saved = JSON.parse(localStorage.getItem(ACCUMULATED_PETALS_KEY));
          if (!saved || !Array.isArray(saved.petals)) return false;

          const scaleX = saved.width ? width / saved.width : 1;
          const scaleY = saved.height ? height / saved.height : 1;
          const wasBottomOnly = saved.height && saved.petals.length > 0 &&
            saved.petals.every(p => p.y > saved.height * 0.85);
          accumulatedPetals = saved.petals.slice(0, MAX_ACCUMULATED).map(p => ({
            ...p,
            x: wasBottomOnly ? Math.random() * width : p.x * scaleX,
            y: wasBottomOnly ? Math.random() * height : p.y * scaleY,
          }));
          if (wasBottomOnly) saveAccumulatedPetals();
          return accumulatedPetals.length > 0;
        } catch (error) {
          return false;
        }
      }

      function fillScreenWithPetals() {
        for (const petal of accumulatedPetals) {
          petal.x = Math.random() * width;
          petal.y = Math.random() * height;
        }
        while (accumulatedPetals.length < MAX_ACCUMULATED) {
          const petal = createSettledPetal();
          petal.x = Math.random() * width;
          petal.y = Math.random() * height;
          accumulatedPetals.push(petal);
        }
        saveAccumulatedPetals();
      }

      // ============================================================
      // RESIZE
      // ============================================================
      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        // rebuild petals to fit new size
        rebuildPetals();
      }

      function rebuildPetals() {
        const count = Math.min(
          MAX_PETALS,
          Math.floor(PETAL_BASE_COUNT * densityMultiplier)
        );
        fallingPetals = [];
        for (let i = 0; i < count; i++) {
          fallingPetals.push(createPetal(Math.random() * height));
        }
        // keep accumulated petals but reposition
        accumulatedPetals.forEach(p => {
          p.x = Math.min(p.x, width);
        });
      }

      // ============================================================
      // DRAWING
      // ============================================================
      function drawPetalShape(ctx2, p, x, y, rot, alphaOverride) {
        ctx2.save();
        ctx2.translate(x, y);
        ctx2.rotate(rot);
        const a = alphaOverride !== undefined ? alphaOverride : p.alpha;
        ctx2.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${a})`;

        const s = p.size;
        ctx2.beginPath();

        if (p.type === 0) {
          const w = s * 0.9;
          const h = s * 0.7;
          ctx2.moveTo(0, -h * 0.5);
          ctx2.bezierCurveTo(w * 0.5, -h * 0.8, w * 0.8, h * 0.2, 0, h * 0.5);
          ctx2.bezierCurveTo(-w * 0.8, h * 0.2, -w * 0.5, -h * 0.8, 0, -h * 0.5);
        } else if (p.type === 1) {
          const r1 = s * 0.5 * p.seed1;
          const r2 = s * 0.5 * p.seed2;
          ctx2.moveTo(0, -r1 * 0.8);
          ctx2.quadraticCurveTo(r2 * 0.9, -r1 * 0.2, r2 * 0.6, r2 * 0.6);
          ctx2.quadraticCurveTo(-r2 * 0.7, r2 * 0.9, -r1 * 0.8, r1 * 0.3);
          ctx2.quadraticCurveTo(-r1 * 1.1, -r2 * 0.5, 0, -r1 * 0.8);
        } else {
          const a2 = s * 0.45;
          const b = s * 0.5;
          ctx2.moveTo(0, -a2);
          ctx2.quadraticCurveTo(b * 0.7, -b * 0.7, 0, b * 0.1);
          ctx2.quadraticCurveTo(-b * 0.7, -b * 0.7, 0, -a2);
        }

        ctx2.closePath();
        ctx2.fill();
        ctx2.restore();
      }

      // ============================================================
      // PETAL UPDATE
      // ============================================================
      function updatePetals() {
        // cursor velocity
        if (mouseActive && lastMouseX > -1000) {
          mouseVX = mouseX - lastMouseX;
          mouseVY = mouseY - lastMouseY;
          const maxV = 14;
          if (Math.abs(mouseVX) > maxV) mouseVX = Math.sign(mouseVX) * maxV;
          if (Math.abs(mouseVY) > maxV) mouseVY = Math.sign(mouseVY) * maxV;
        } else {
          mouseVX *= 0.95;
          mouseVY *= 0.95;
        }
        lastMouseX = mouseX;
        lastMouseY = mouseY;

        const windSpeed = Math.hypot(mouseVX, mouseVY);
        const windActive = windSpeed > 1.5 && mouseActive && !reduceMotion;

        for (let i = fallingPetals.length - 1; i >= 0; i--) {
          const p = fallingPetals[i];

          // Wind push
          if (windActive) {
            const dx = p.x - mouseX;
            const dy = p.y - mouseY;
            const dist = Math.hypot(dx, dy);
            if (dist < WIND_RADIUS && dist > 0.01) {
              const nx = dx / dist;
              const ny = dy / dist;
              const falloff = 1 - (dist / WIND_RADIUS);
              const force = WIND_STRENGTH * falloff * (0.8 + windSpeed * 0.08);
              p.windVX += nx * force * 0.9 + mouseVX * 0.02 * falloff;
              p.windVY += ny * force * 0.4 + mouseVY * 0.02 * falloff;
              p.rotBoost += (Math.random() - 0.5) * 0.03 * falloff;
            }
          }

          // Apply wind
          p.x += p.windVX;
          p.y += p.windVY;
          p.windVX *= 0.92;
          p.windVY *= 0.92;
          p.rotBoost *= 0.9;

          // Natural fall with diagonal drift + gentle sway
          p.swayPhase += p.swaySpeed;
          const sway = Math.sin(p.swayPhase) * 0.25;

          p.y += p.speedY;
          p.x += p.driftX + sway;
          p.rot += p.rotSpeed + p.rotBoost;

          // Respawn or accumulate
          const margin = p.size * 2;

          // Horizontal wrap
          if (p.x > width + margin) {
            p.x = -margin;
            p.y = Math.random() * height;
          }
          if (p.x < -margin) {
            p.x = width + margin;
            p.y = Math.random() * height;
          }

          // Settle randomly anywhere in the viewport instead of collecting at the bottom.
          const settleChance = 0.015 * densityMultiplier;
          if (Math.random() < settleChance && accumulatedPetals.length < MAX_ACCUMULATED) {
              accumulatedPetals.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: p.size * rand(0.9, 1.1),
                type: p.type,
                hue: p.hue,
                sat: p.sat,
                light: p.light,
                alpha: rand(0.5, 0.9),
                rot: p.rot,
                seed1: p.seed1,
                seed2: p.seed2,
              });
              saveAccumulatedPetals();
              // remove from falling
              fallingPetals.splice(i, 1);
              continue;
          }

          if (p.y > height + margin) {
            // Respawn at top
            Object.assign(p, createPetal(-margin - Math.random() * 100));
          }
          if (p.y < -margin * 2) {
            p.y = height + margin;
            p.x = Math.random() * width;
          }
        }

        // Maintain density: add or remove falling petals based on densityMultiplier
        const targetCount = Math.min(
          MAX_PETALS,
          Math.floor(PETAL_BASE_COUNT * densityMultiplier)
        );
        while (fallingPetals.length < targetCount) {
          fallingPetals.push(createPetal(-20 - Math.random() * 150));
        }
        while (fallingPetals.length > targetCount && fallingPetals.length > 1) {
          fallingPetals.pop();
        }
      }

      // ============================================================
      // DRAW SCENE
      // ============================================================
      function drawScene() {
        ctx.clearRect(0, 0, width, height);

        // Once the timer ends, remove all gray gaps behind the full-screen petal bed.
        if (countdownDone) {
          ctx.fillStyle = '#f3b8c8';
          ctx.fillRect(0, 0, width, height);
        }

        // Draw accumulated petals (behind falling ones)
        for (const p of accumulatedPetals) {
          drawPetalShape(ctx, p, p.x, p.y, p.rot, p.alpha);
        }

        // Draw falling petals
        for (const p of fallingPetals) {
          drawPetalShape(ctx, p, p.x, p.y, p.rot, p.alpha);
        }
      }

      // ============================================================
      // TIME ZONE AWARE COUNTDOWN
      // ============================================================
      // Target: 24 September 2026, 12:00 AM (midnight) in Africa/Cairo.
      // We use Intl.DateTimeFormat with the time zone to find the
      // exact UTC timestamp corresponding to that local time.

      function getTargetTimestamp() {
        // The target local date/time in Cairo
        const year = 2026;
        const month = 9;   // September (0-indexed: 8, but we use 9 for clarity below)
        const day = 24;
        const hour = 0;
        const minute = 0;
        const second = 0;

        // We need to find the UTC timestamp that corresponds to
        // 2026-09-24 00:00:00 in Africa/Cairo.
        //
        // Strategy: create a date string with the target local time,
        // then use Intl to find the offset for Cairo at that time.
        //
        // A robust approach: iterate to find the UTC time such that
        // formatting it in Cairo gives the desired local time.

        // Start with a guess: UTC date with same numbers
        let guess = Date.UTC(year, month - 1, day, hour, minute, second);

        // Use Intl to get the actual local time in Cairo for that UTC guess
        const formatter = new Intl.DateTimeFormat('en-US', {
          timeZone: 'Africa/Cairo',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false,
        });

        // Iterate a few times to converge (usually 1-2 iterations)
        for (let i = 0; i < 5; i++) {
          const parts = formatter.formatToParts(new Date(guess));
          const get = (type) => {
            const part = parts.find(p => p.type === type);
            return part ? parseInt(part.value, 10) : 0;
          };
          const localYear = get('year');
          const localMonth = get('month');
          const localDay = get('day');
          const localHour = get('hour');
          const localMinute = get('minute');
          const localSecond = get('second');

          // Desired local values
          const desired = Date.UTC(year, month - 1, day, hour, minute, second);
          const actual = Date.UTC(localYear, localMonth - 1, localDay, localHour, localMinute, localSecond);
          const diff = desired - actual;

          if (diff === 0) break;
          guess += diff;
        }

        return guess;
      }

      async function syncClock() {
        const requestStart = Date.now();
        const response = await fetch('https://worldtimeapi.org/api/timezone/Africa/Cairo', {
          cache: 'no-store',
        });
        const requestEnd = Date.now();
        if (!response.ok) throw new Error('Time service unavailable');

        const data = await response.json();
        if (!Number.isFinite(data.unixtime)) throw new Error('Invalid time response');

        const localMidpoint = requestStart + (requestEnd - requestStart) / 2;
        clockOffsetMs = data.unixtime * 1000 - localMidpoint;
      }

      function getCurrentTime() {
        return Date.now() + clockOffsetMs;
      }

      // ============================================================
      // COUNTDOWN LOGIC
      // ============================================================
      const DAY_SEC = 24 * 3600;

      function updateCountdown() {
        if (countdownDone) return;

        const now = getCurrentTime();
        let remaining = Math.max(0, targetTime - now);

        if (remaining <= 0) {
          countdownDone = true;
          fillScreenWithPetals();
          // Freeze at zero
          document.getElementById('line1').textContent = '0d';
          document.getElementById('line2').textContent = '00h 00m 00s';
          window.location.assign('lockey.html');
          return;
        }

        const totalSec = Math.floor(remaining / 1000);

        const days = Math.floor(totalSec / DAY_SEC);
        let rem = totalSec % DAY_SEC;
        rem %= DAY_SEC;
        const hours = Math.floor(rem / 3600);
        rem %= 3600;
        const minutes = Math.floor(rem / 60);
        const seconds = rem % 60;

        document.getElementById('line1').textContent = `${days}d`;
        document.getElementById('line2').textContent =
          `${hours.toString().padStart(2,'0')}h ${minutes.toString().padStart(2,'0')}m ${seconds.toString().padStart(2,'0')}s`;
      }

      // ============================================================
      // DENSITY / FINAL-DAY TRANSFORMATION
      // ============================================================
      function updateDensity() {
        if (countdownDone) {
          densityMultiplier = 3.5;
          return;
        }

        const now = getCurrentTime();
        const remaining = Math.max(0, targetTime - now);
        const totalDuration = targetTime - (targetTime - 30 * 24 * 3600 * 1000); // 30 days before target

        // Time since we started (or since 30 days before target)
        // Simpler: compute progress from "30 days before target" to target
        const thirtyDaysMs = 30 * 24 * 3600 * 1000;
        const startWindow = targetTime - thirtyDaysMs;
        const elapsed = now - startWindow;
        const progress = Math.max(0, Math.min(1, elapsed / thirtyDaysMs));

        // On the final day (progress > ~0.966), ramp up dramatically
        const finalDayStart = 1 - (1 / 30); // ~0.9667
        if (progress > finalDayStart) {
          const finalProgress = (progress - finalDayStart) / (1 - finalDayStart);
          densityMultiplier = 1 + finalProgress * 3.5;
        } else {
          densityMultiplier = 1 + progress * 0.5; // gentle growth
        }

        // Cap
        densityMultiplier = Math.min(densityMultiplier, 4.5);
      }

      // ============================================================
      // ANIMATION LOOP
      // ============================================================
      let animId = null;

      function animate() {
        if (!width || !height) {
          animId = requestAnimationFrame(animate);
          return;
        }

        if (!reduceMotion) {
          updatePetals();
          updateDensity();
        }

        drawScene();
        animId = requestAnimationFrame(animate);
      }

      // ============================================================
      // EVENT HANDLERS
      // ============================================================
      function onMouseMove(e) {
        mouseActive = true;
        mouseX = e.clientX;
        mouseY = e.clientY;
      }

      function onTouchMove(e) {
        if (e.touches.length > 0) {
          mouseActive = true;
          mouseX = e.touches[0].clientX;
          mouseY = e.touches[0].clientY;
        }
      }

      function deactivateMouse() {
        mouseActive = false;
        mouseX = -10000;
        mouseY = -10000;
      }

      // ============================================================
      // INIT
      // ============================================================
      function init() {
        resizeCanvas();

        // Compute one absolute target timestamp; reloads do not restart it.
        targetTime = getTargetTimestamp();

        // Correct the local clock when the time service is reachable.
        syncClock().catch(() => {
          // The local clock remains the fallback if the service is unavailable.
        }).finally(updateCountdown);

        // Restore settled petals so reloads keep the accumulated scene.
        if (!loadAccumulatedPetals()) {
          for (let i = 0; i < 25; i++) {
            accumulatedPetals.push(createSettledPetal());
          }
          saveAccumulatedPetals();
        }

        // Initial countdown display
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Start animation
        if (animId) cancelAnimationFrame(animId);
        animId = requestAnimationFrame(animate);

        // Listeners
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseleave', deactivateMouse);
        window.addEventListener('touchmove', onTouchMove, { passive: true });
        window.addEventListener('touchend', deactivateMouse);
        window.addEventListener('touchcancel', deactivateMouse);
        window.addEventListener('resize', () => {
          resizeCanvas();
        });
      }

      // Start
      init();
    })();
  </script>
</body>
</html>
